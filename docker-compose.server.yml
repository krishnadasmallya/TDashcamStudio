version: '3.8'

services:
  tdashcam-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tdashcam-server
    ports:
      - "8188:80"
    volumes:
      # Mount your TeslaCam folder here
      - /path/to/your/TeslaCam:/teslacam:ro
    environment:
      - TZ=Australia/Sydney
      - TESLACAM_PATH=/teslacam
      - PORT=3000
    restart: unless-stopped
    networks:
      - tdashcam-network

networks:
  tdashcam-network:
    driver: bridge
